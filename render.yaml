services:
  # ── Backend Web Service (FastAPI) ──────────────────────────────────
  - type: web
    name: resume-parser-backend
    runtime: python
    rootDir: resume_parser/backend
    plan: free
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: USE_SENTENCE_TRANSFORMERS
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"

  # ── Frontend Static Site (React + Vite) ────────────────────────────
  - type: web
    name: resume-parser-frontend
    runtime: static
    rootDir: resume_parser/frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: resume-parser-backend
          property: host

